name: Android Preview

# Builds a standalone release APK (app-release.apk) and uploads it as a GitHub Artifact.
# Replaces EAS "preview" builds for Android.
#
# NOTE: This intentionally builds a *release* variant (not assembleDebug).
# A debug APK does NOT embed the JS bundle — it fetches it from the Metro dev
# server at runtime, so a debug APK installed on a real device (no Metro
# reachable) hangs forever on the splash screen. The release variant embeds the
# Hermes bundle and is signed with the template's debug keystore, so it installs
# and runs standalone on any device (same behavior as an EAS "preview" build).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
      # Public client config (EXPO_PUBLIC_* is embedded in the bundle at build time
      # by app.config.js). These MUST be present in CI or the APK ships without
      # Supabase config and every auth method fails with "Supabase is not configured".
      # Accepts either an Actions secret OR an Actions variable (repository/env level).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_CENTRAL_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_CENTRAL_SUPABASE_URL || vars.EXPO_PUBLIC_CENTRAL_SUPABASE_URL }}
      EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL || vars.EXPO_PUBLIC_WEB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify required EXPO_PUBLIC_* build config
        run: |
          missing=()
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_CENTRAL_SUPABASE_URL EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required build config: ${missing[*]}"
            echo "Add them under GitHub -> Settings -> Secrets and variables -> Actions (as secrets or variables)."
            echo "Without them the APK ships without Supabase config and all auth fails."
            exit 1
          fi
          echo "All required EXPO_PUBLIC_* build config present."

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK (standalone, embeds JS bundle)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
