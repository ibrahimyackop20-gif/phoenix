name: Android Release

# Builds a release App Bundle (app-release.aab) and uploads it as a GitHub Artifact.
# Manual trigger only. Replaces EAS "production" builds for Android.
#
# Release signing:
#   Provide the following repo secrets to produce a Play-ready, signed AAB:
#     ANDROID_KEYSTORE_BASE64   (base64 of your .jks/.keystore file)
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
#   If these are missing, the AAB is built with the default debug signing
#   (NOT suitable for Play Store distribution).
#
# Firebase / FCM (optional but recommended for push):
#     GOOGLE_SERVICES_JSON_BASE64  (base64 of google-services.json)
on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
      # Public client config (EXPO_PUBLIC_* is embedded in the bundle at build time
      # by app.config.js). MUST be present or the AAB ships without Supabase config
      # and every auth method fails with "Supabase is not configured".
      # Accepts either an Actions secret OR an Actions variable.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_CENTRAL_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_CENTRAL_SUPABASE_URL || vars.EXPO_PUBLIC_CENTRAL_SUPABASE_URL }}
      EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL || vars.EXPO_PUBLIC_WEB_URL }}
      # Release signing (optional). Consumed by scripts/ci-android-signing.js
      # and the injected release signingConfig.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify required EXPO_PUBLIC_* build config
        run: |
          missing=()
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_CENTRAL_SUPABASE_URL EXPO_PUBLIC_CENTRAL_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required build config: ${missing[*]}"
            echo "Add them under GitHub -> Settings -> Secrets and variables -> Actions (as secrets or variables)."
            echo "Without them the AAB ships without Supabase config and all auth fails."
            exit 1
          fi
          echo "All required EXPO_PUBLIC_* build config present."

      - name: Install dependencies (npm ci)
        run: npm ci

      # Google Play requires a unique, strictly increasing versionCode per upload.
      # app.json pins versionCode: 1 for local/dev; CI overrides via ANDROID_VERSION_CODE
      # before `expo prebuild` so the value is baked into android/app/build.gradle.
      # Formula: 1000 + github.run_number → always > previously uploaded 1, and unique per run.
      - name: Compute unique Android versionCode
        run: |
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          echo "ANDROID_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Computed ANDROID_VERSION_CODE=${VERSION_CODE} (1000 + run_number ${{ github.run_number }})"

      # FCM / Google Services: real google-services.json is not in git.
      # Prefer secret GOOGLE_SERVICES_JSON_BASE64; otherwise copy the example so
      # `expo prebuild` still succeeds (push notifications need the real file).
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
            echo "Restored google-services.json from GOOGLE_SERVICES_JSON_BASE64."
          else
            cp google-services.json.example google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret missing. Using google-services.json.example — Android FCM will not work until you add the secret."
          fi

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Verify versionCode in generated Gradle project
        run: |
          echo "Expecting versionCode=${ANDROID_VERSION_CODE}"
          grep -n "versionCode" android/app/build.gradle || true
          if ! grep -qE "versionCode[[:space:]]+${ANDROID_VERSION_CODE}" android/app/build.gradle; then
            echo "::error::Generated android/app/build.gradle does not contain versionCode ${ANDROID_VERSION_CODE}"
            exit 1
          fi
          echo "Verified versionCode ${ANDROID_VERSION_CODE} in android/app/build.gradle"

      - name: Decode release keystore (if provided)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "ANDROID_KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded to android/app/release.keystore."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found. The AAB will use the default debug signing and is NOT Play-ready."
          fi

      - name: Configure release signing (CI-only, generated android/)
        run: node scripts/ci-android-signing.js

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-vc${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
